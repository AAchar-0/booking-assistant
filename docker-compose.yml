# Local PostgreSQL for development:  docker compose up -d db
# Then:  DATABASE_URL=postgres://booking:booking@localhost:5432/booking  (these are local throw-away credentials)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  booking-data:
